spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  issuer: test-issuer
  secret-key: dGVzdC1vbmx5LXNlY3JldC1rZXktbm90LWZvci1wcm9kdWN0aW9uLXVzZS1hdC1hbGw=
  token:
    durations:
      oidc-auth: 1200000
      access: 86400000
      refresh: 2592000000

oauth:
  kakao:
    public-key-url: https://kauth.kakao.com/.well-known/jwks.json
  apple:
    public-key-url: https://appleid.apple.com/auth/keys
  google:
    client-id:
      web: test-web-client-id
      ios: test-ios-client-id
      android: test-android-client-id
