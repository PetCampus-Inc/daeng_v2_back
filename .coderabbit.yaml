# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
tone_instructions: "리뷰와 요약은 한국어로 작성한다. 코드 식별자와 고유 명사는 원문을 유지하고, 근거 없는 추측은 하지 않는다."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary_in_walkthrough: true
  poem: false
  collapse_walkthrough: false
  related_issues: false
  suggested_labels: false
  suggested_reviewers: false
  review_status: true
  commit_status: false
  tools:
    github-checks:
      enabled: false
  finishing_touches:
    unit_tests:
      enabled: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
  path_instructions:
    - path: "docs/work/*.md"
      instructions: |
        이 작업 문서가 포함된 PR에서는 일반 코드 품질 의견보다 먼저 다음을 검토하고, 발견사항을 리뷰 요약의 첫 부분에 제시한다.
        - PR의 변경 파일이 문서의 작업 범위와 제외 범위에 부합하는지 확인한다.
        - 작업 범위와 무관한 파일, 누락된 문서 갱신, 문서 간 직접 모순을 파일·위치와 함께 알린다.
        - 완료·검증 기록은 PR diff에서 확인 가능한 근거로만 평가한다. 이 파일럿에서는 GitHub Checks 연동이 꺼져 있으므로 CI 결과를 근거로 추정하지 않는다. 근거가 없으면 결함으로 단정하지 말고 "확인 불가"로 표시한다.
        - ADR은 당시 결정의 배경·이력으로만 사용한다. ADR과 현재 코드·인벤토리의 차이만으로 결함으로 단정하지 않는다.

knowledge_base:
  web_search:
    enabled: false
  mcp:
    usage: disabled
  linked_repositories: []
