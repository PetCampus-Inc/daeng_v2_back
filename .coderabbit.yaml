# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
tone_instructions: "리뷰와 요약은 한국어로 작성한다. 코드 식별자와 고유 명사는 원문을 유지하고, 근거 없는 추측은 하지 않는다."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary_in_walkthrough: true
  poem: false
  collapse_walkthrough: false
  related_issues: false
  suggested_labels: false
  suggested_reviewers: false
  review_status: true
  commit_status: false
  tools:
    github-checks:
      enabled: false
  finishing_touches:
    unit_tests:
      enabled: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
  path_filters:
    - "!docs/**"
    - "!**/*.md"

knowledge_base:
  web_search:
    enabled: false
  mcp:
    usage: disabled
  linked_repositories: []
